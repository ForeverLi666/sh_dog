schema_version: 1

platform:
  os: ubuntu
  os_version: "22.04"
  architecture: x86_64
  glibc: "2.35"
  nvidia_driver:
    minimum: "580.65.06"
    verified: "580.173.02"

software:
  python: "3.11.15"
  isaac_sim:
    product_version: "5.1.0"
    distribution_version: "5.1.0.0"
    install_extras: [all, extscache]
  isaac_lab:
    release: v2.3.2
    commit: 37ddf626871758333d6ed89cf64ad702aef127d0
    distribution_version: "0.54.2"
  pytorch:
    version: 2.7.0+cu128
    torchvision: 0.22.0+cu128
    cuda_runtime: "12.8"
  rsl_rl: "3.1.2"
  physics: physx

compatibility_pins:
  numpy: "1.26.0"
  pillow: "11.3.0"
  packaging: "23.0"
  wheel: "0.45.1"
  setuptools: "80.9.0"
  psutil: "5.9.8"
  typing_extensions: "4.12.2"
  click: "8.1.7"
  gymnasium: "1.2.1"
  onnx: "1.18.0"
  onnxscript: "0.5.0"
  ipython: "8.39.0"
  fastapi: "0.115.7"
  starlette: "0.49.1"

known_metadata_conflicts:
  - id: fastapi-starlette
    status: accepted
    requirement: fastapi 0.115.7 requires starlette >=0.40.0,<0.46.0
    installed: starlette 0.49.1
    reason: Isaac Lab v2.3.2 pins the security-fixed Starlette 0.49.1.
    allowed_workflows:
      - headless_training
      - local_gui
      - local_asset_conversion
    disabled_workflows:
      - http_services
      - cloud_livestream

artifact_policy:
  checkpoints: training_environment_only
  cross_environment_formats:
    - torchscript
    - onnx
