schema_version = 1

[robot]
name = "sh_dog"
source_urdf = "raw/urdf/urdf-v2-2.urdf"
source_robot_name = "urdf-v2-2"
joint_order = [
    "fl_abad_joint",
    "fl_hip_joint",
    "fl_knee_joint",
    "fr_abad_joint",
    "fr_hip_joint",
    "fr_knee_joint",
    "rl_abad_joint",
    "rl_hip_joint",
    "rl_knee_joint",
    "rr_abad_joint",
    "rr_hip_joint",
    "rr_knee_joint",
]

[default_state]
# Stable real-robot stance in standard joint order.
joint_positions_rad = [
    0.00, 0.872, -1.512,
    0.00, 0.872, -1.512,
    0.00, 0.872, -1.512,
    0.00, 0.872, -1.512,
]
base_height_m = 0.40

[actuator]
model = "ROBOstride 06"
rated_torque_nm = 11.0
peak_torque_nm = 36.0
no_load_speed_rpm = 480.0
low_speed_equivalent_inertia_kg_m2 = 0.012

[actuator.torque_speed]
torque_safety_factor = 0.9
max_speed_rpm = [280.0, 320.0, 390.0, 426.0, 430.0]
max_torque_nm = [36.0, 30.0, 20.0, 11.0, 5.0]
thermal_speed_rpm = [100.0, 160.0, 220.0, 280.0, 340.0, 400.0]
thermal_torque_nm = [11.2, 11.0, 10.5, 9.87, 9.4, 9.3]

[actuator.overload]
time_safety_factor = 0.9
rotating_torque_nm = [17.0, 20.0, 25.0, 30.0, 36.0]
rotating_time_s = [200.0, 36.0, 18.0, 8.0, 4.0]
stall_rated_torque_nm = 8.0
stall_torque_nm = [11.0, 17.0, 25.0, 30.0, 36.0]
stall_time_s = [200.0, 15.0, 5.0, 1.0, 1.0]
stall_blend_speed_rpm = 100.0
recovery_time_s = 200.0
initial_budget_range = [0.0, 1.0]
release_budget = 0.2

[additional_reduction]
abad = 1.0
hip = 1.0
knee = 2.0

[normalization.joint_renames]
fl_foot_joinf = "fl_foot_joint"

# Leg geometry is defined for front-left and mirrored by link prefix.

[collision.base_link]
shape = "box"
xyz = [0.0, 0.0, -0.03]
size = [0.29, 0.142, 0.13]

[collision.abad_link]
shape = "cylinder"
xyz = [0.05877, -0.01225, 0.0]
rpy = [0.0, 1.57079632679, 0.0]
radius = 0.046
length = 0.08

[collision.hip_link]
shape = "box"
xyz = [0.0, 0.08215, -0.115]
size = [0.065, 0.04, 0.11]

[collision.knee_link]
shape = "cylinder"
xyz = [0.0155, 0.0, -0.15]
rpy = [0.0, -0.1044, 0.0]
radius = 0.015
length = 0.14

[collision.foot_link]
shape = "sphere"
xyz = [-0.0045, 0.0, -0.005]
radius = 0.0225
