schema_version = 1

[robot]
name = "sh_dog"
source_urdf = "raw/urdf/urdf-v2-2.urdf"
source_robot_name = "urdf-v2-2"
joint_order = [
    "fl_abad_joint",
    "fl_hip_joint",
    "fl_knee_joint",
    "fr_abad_joint",
    "fr_hip_joint",
    "fr_knee_joint",
    "rl_abad_joint",
    "rl_hip_joint",
    "rl_knee_joint",
    "rr_abad_joint",
    "rr_hip_joint",
    "rr_knee_joint",
]

[default_state]
# Stable real-robot stance in standard joint order.
joint_positions_rad = [
    0.00, 0.872, -1.512,
    0.00, 0.872, -1.512,
    0.00, 0.872, -1.512,
    0.00, 0.872, -1.512,
]
base_height_m = 0.40

[actuator]
model = "ROBOstride 06"
rated_torque_nm = 11.0
peak_torque_nm = 36.0
no_load_speed_rpm = 480.0
low_speed_equivalent_inertia_kg_m2 = 0.012

[additional_reduction]
abad = 1.0
hip = 1.0
knee = 2.0

[normalization.joint_renames]
fl_foot_joinf = "fl_foot_joint"

# Leg geometry is defined for front-left and mirrored by link prefix.

[collision.base_link]
shape = "box"
xyz = [0.0, 0.0, -0.03]
size = [0.29, 0.142, 0.13]

[collision.abad_link]
shape = "cylinder"
xyz = [0.05877, -0.01225, 0.0]
rpy = [0.0, 1.57079632679, 0.0]
radius = 0.046
length = 0.08

[collision.hip_link]
shape = "box"
xyz = [0.0, 0.08215, -0.115]
size = [0.065, 0.04, 0.11]

[collision.knee_link]
shape = "cylinder"
xyz = [0.0155, 0.0, -0.15]
rpy = [0.0, -0.1044, 0.0]
radius = 0.015
length = 0.14

[collision.foot_link]
shape = "sphere"
xyz = [-0.0045, 0.0, -0.005]
radius = 0.0225
